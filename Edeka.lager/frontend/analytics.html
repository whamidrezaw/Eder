<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyse &amp; Berichte — EDEKA Lager</title>
<link rel="stylesheet" href="/assets/shared.css">
<style>
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .period-select { max-width: 160px; }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<div class="main-area">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <div>
        <div class="topbar-title">📊 Analyse &amp; Berichte</div>
        <div class="topbar-date" id="topbar-date"></div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" onclick="toggleTheme()" title="Theme wechseln">🌓</button>
      <button class="btn btn-primary" onclick="handleSendReport()">📤 Bericht jetzt senden</button>
    </div>
  </header>

  <main class="content">

    <div class="filter-tabs" style="margin-bottom:18px">
      <button class="filter-tab active" id="tab-btn-today" onclick="switchTab('today')">📅 Heute</button>
      <button class="filter-tab" id="tab-btn-trend" onclick="switchTab('trend')">📈 Verlauf</button>
    </div>

    <!-- ── TAB: Heute ─────────────────────────────────────────── -->
    <div class="tab-content active" id="tab-today">
      <div class="table-header-row" style="background:transparent; border:none; padding:0 0 12px;">
        <div>
          <div class="table-title">Berichte von heute</div>
          <div class="table-meta" id="today-meta">…</div>
        </div>
        <div class="table-actions">
          <button class="btn btn-ghost" onclick="downloadReportFile('excel', {})">📊 Excel (Live)</button>
          <button class="btn btn-ghost" onclick="downloadReportFile('pdf', {})">📄 PDF (Live)</button>
        </div>
      </div>

      <div class="report-list" id="today-list">
        <div class="skeleton" style="height:60px"></div>
      </div>
      <div class="empty-state" id="today-empty" style="display:none">
        <div class="empty-icon">📭</div>
        <div class="empty-title">Heute noch kein Bericht gesendet</div>
        <div class="empty-desc">Klicke auf „Bericht jetzt senden", um den ersten Bericht des Tages zu erstellen.</div>
      </div>
    </div>

    <!-- ── TAB: Verlauf ───────────────────────────────────────── -->
    <div class="tab-content" id="tab-trend">
      <div class="toolbar" style="margin-bottom:16px">
        <select class="form-ctrl period-select" id="period-select" onchange="loadTrend()">
          <option value="7">Letzte 7 Tage</option>
          <option value="14" selected>Letzte 14 Tage</option>
          <option value="30">Letzte 30 Tage</option>
          <option value="90">Letzte 90 Tage</option>
        </select>
      </div>

      <div class="kpi-grid" id="trend-kpi-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom:20px"></div>

      <div class="chart-grid">
        <div class="chart-card">
          <div class="chart-card-head">
            <div>
              <div class="chart-card-title">Verbrauch pro Tag</div>
              <div class="chart-card-sub">Basierend auf dem Tagesabschluss (00:00)</div>
            </div>
          </div>
          <div class="chart-wrap">
            <canvas id="trend-chart" height="100"></canvas>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-card-head">
            <div class="chart-card-title">Meistverbraucht</div>
          </div>
          <div class="top-list" id="top-products-list"></div>
        </div>
      </div>

      <div class="section-label">Verbrauch nach Kategorie</div>
      <div class="kpi-grid" id="category-breakdown-grid"></div>
    </div>

  </main>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script src="/assets/shared.js"></script>
<script src="/assets/chart.umd.min.js"></script>
<script src="/assets/analytics.js"></script>
</body>
</html>
